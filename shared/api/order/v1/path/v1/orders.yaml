post:
  tags:
    - Order
  summary: Создать заказ
  description: Создаёт заказ из выбранных пользователем деталей
  operationId: createOrder

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/order/create_order_request.yaml"

  responses:
    '201':
      description: Заказ успешно создан
      content:
        application/json:
          schema:
            $ref: ../../components/order/create_order_response.yaml
    '404':
      description: Деталь не найдена
      content:
        application/json:
          schema:
            $ref: "../../components/order/errors/create_order_not_found_error.yaml"

    '400':
      description: Данные запроса переданы не верно
      content:
        application/json:
          schema:
            $ref: "../../components/order/errors/create_order_bad_request_error.yaml"

    '500':
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: "../../components/order/errors/create_order_internal_error.yaml"

    default:
      description: Неизвестная ошибка
      content:
        application/json:
          schema:
            $ref: "../../components/order/errors/generic_error.yaml"

