get:
  tags:
    - Order
  summary: Получить заказ
  description: Получить информацию о заказе по его UUID
  operationId: getOrderByUUID
  parameters:
    - name: order_uuid
      in: path
      required: true
      description: UUID заказа
      schema:
        type: string
        format: uuid

  responses:
    '200':
      description: Информация о заказе успешно получена
      content:
        application/json:
          schema:
            $ref: "../../components/order/order.yaml"
    '404':
      description: Заказ не найден
      content:
        application/json:
          schema:
            $ref: "../../components/order/errors/get_order_not_found.yaml"
    '400':
      description: Невалидные переданные данные
      content:
        application/json:
          schema:
            $ref: "../../components/order/errors/create_order_bad_request_error.yaml"
    default:
      description: Неизвестная ошибка
      content:
        application/json:
          schema:
            $ref: "../../components/order/errors/generic_error.yaml"